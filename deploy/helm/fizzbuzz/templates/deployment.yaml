{{- range .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/part-of: {{ $.Chart.Name }}
spec:
  replicas: {{ $.Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .name }}
        app.kubernetes.io/part-of: {{ $.Chart.Name }}
    spec:
      containers:
        - name: {{ .name }}
          image: "{{ $.Values.image.repository }}/{{ .name }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .port }}
          env:
            - name: FIZZ_NEXT_ROLLOUT_PERCENT
              value: {{ $.Values.featureFlags.fizzNextRolloutPercent | quote }}
            - name: KAFKA_TOPIC
              value: {{ $.Values.kafka.topic | quote }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
{{- end }}
