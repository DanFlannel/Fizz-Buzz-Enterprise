{{- if .Values.autoscaling.enabled }}
{{- range .Values.services }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .name }}
  minReplicas: {{ $.Values.autoscaling.minReplicas }}
  maxReplicas: {{ $.Values.autoscaling.maxReplicas }}
  metrics:
    - type: Pods
      pods:
        metric:
          name: fizzbuzz_modulo_latency_p99_microseconds
        target:
          type: AverageValue
          averageValue: {{ $.Values.autoscaling.targetModuloLatencyP99Micros | quote }}
{{- end }}
{{- end }}
